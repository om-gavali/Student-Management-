<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Dashboard</title>
    <style>
        body {
            font-family: Arial;
            background: #f8f9fa;
        }
        header {
            background: #343a40;
            color: white;
            padding: 15px;
            text-align: center;
        }
        .container {
            padding: 30px;
            text-align: center;
        }
        a {
            display: inline-block;
            padding: 10px 15px;
            background: #007bff;
            color: white;
            text-decoration: none;
            margin: 10px;
        }
        a:hover {
            background: #0056b3;
        }
    </style>
</head>
<body>

<header>
    <h2>Student Management System</h2>
</header>

<div class="container">
    <h3>Welcome!</h3>
    <a th:href="@{/students}">Manage Students</a>
    <a th:href="@{/logout}">Logout</a>
</div>

</body>
</html>
