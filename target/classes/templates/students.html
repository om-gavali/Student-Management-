<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Students</title>
    <style>
        body {
            font-family: Arial;
            background: #f4f6f9;
        }
        table {
            width: 80%;
            margin: auto;
            border-collapse: collapse;
            background: white;
        }
        th, td {
            padding: 12px;
            border: 1px solid #ddd;
        }
        th {
            background: #007bff;
            color: white;
        }
        a {
            padding: 5px 10px;
            background: #28a745;
            color: white;
            text-decoration: none;
        }
        .delete {
            background: #dc3545;
        }
        .top {
            text-align: center;
            margin: 20px;
        }
    </style>
</head>
<body>
	<a th:href="@{/students}">Manage Students</a>
	    <a th:href="@{/logout}">Logout</a>
<div class="top">
    <a th:href="@{/students/new}">Add Student</a>
</div>

<table>
    <tr>
        <th>ID</th>
        <th>First Name</th>
        <th>Last Name</th>
        <th>Email</th>
        <th>Actions</th>
    </tr>

    <tr th:each="student : ${students}">
        <td th:text="${student.id}"></td>
        <td th:text="${student.firstName}"></td>
        <td th:text="${student.lastName}"></td>
        <td th:text="${student.email}"></td>
        <td>
            <a th:href="@{/students/edit/{id}(id=${student.id})}">Edit</a>
            <a class="delete" th:href="@{/students/{id}(id=${student.id})}">Delete</a>
        </td>
    </tr>
</table>

</body>
</html>
